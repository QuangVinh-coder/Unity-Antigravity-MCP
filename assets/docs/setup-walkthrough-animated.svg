<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131c31"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="320" rx="16" fill="url(#sbg)" stroke="#334155" stroke-width="2"/>
  <text x="36" y="42" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Animated Setup Walkthrough (4 Steps · Under 2 Minutes)</text>
  <text x="800" y="42" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">● Live Animated Vector Guide</text>

  <!-- Step 1 -->
  <g>
    <rect x="36" y="72" width="236" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.35;0.35;0.35;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="68" cy="106" r="18" fill="#0ea5e9"/>
    <text x="68" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1</text>
    <text x="98" y="112" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Install Plugin</text>
    <text x="52" y="148" fill="#94a3b8" font-family="Consolas, monospace" font-size="11.5">irm .../install.ps1 | iex</text>
    <text x="52" y="176" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Clones MCP Server, Rules</text>
    <text x="52" y="196" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">&amp; Skills into Antigravity IDE</text>
    <text x="52" y="216" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">and runs 6/6 self-tests.</text>
    <rect x="52" y="238" width="204" height="26" rx="6" fill="#0f293a"/>
    <text x="154" y="255" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Windows · macOS · Linux</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="300" y="72" width="236" height="210" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35;0.35" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="332" cy="106" r="18" fill="#9333ea"/>
    <text x="332" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2</text>
    <text x="362" y="112" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Unity UPM Git URL</text>
    <text x="316" y="148" fill="#d8b4fe" font-family="Consolas, monospace" font-size="11">?path=/unity-package</text>
    <text x="316" y="176" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Package Manager → '+' →</text>
    <text x="316" y="196" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Install package from git URL</text>
    <text x="316" y="216" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Zero external DLLs required.</text>
    <rect x="316" y="238" width="204" height="26" rx="6" fill="#27173b"/>
    <text x="418" y="255" text-anchor="middle" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Auto-Syncs .csproj &amp; .sln</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="564" y="72" width="236" height="210" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="596" cy="106" r="18" fill="#d97706"/>
    <text x="596" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3</text>
    <text x="626" y="112" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Toggle Write Lock</text>
    <text x="580" y="148" fill="#fcd34d" font-family="Consolas, monospace" font-size="11">Tools &gt; Antigravity MCP</text>
    <text x="580" y="176" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Open Control Panel in Unity,</text>
    <text x="580" y="196" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">check 'Allow AI Write Actions'</text>
    <text x="580" y="216" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">(auto-relocks after 15 min).</text>
    <rect x="580" y="238" width="204" height="26" rx="6" fill="#35240c"/>
    <text x="682" y="255" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1x Ctrl+Z Atomic Undo</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="828" y="72" width="236" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.35;0.35;0.35;1;0.35" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="860" cy="106" r="18" fill="#059669"/>
    <text x="860" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">4</text>
    <text x="890" y="112" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Build Live with AI</text>
    <text x="844" y="148" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11">127.0.0.1:PORT LIVE</text>
    <text x="844" y="176" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Prompt UI Toolkit, Shaders,</text>
    <text x="844" y="196" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Particles, Animator &amp; Wiring</text>
    <text x="844" y="216" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">or run Multi-Agent Lanes!</text>
    <rect x="844" y="238" width="204" height="26" rx="6" fill="#0d2e24"/>
    <text x="946" y="255" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Press Play Immediately ▶</text>
  </g>

  <!-- Animated Progress Dot -->
  <circle cx="154" cy="300" r="6" fill="#38bdf8">
    <animate attributeName="cx" values="154;418;682;946;154" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
