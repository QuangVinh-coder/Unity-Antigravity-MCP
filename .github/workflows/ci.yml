name: MCP Server & Watchdog CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run MCP Server Tests
        run: node --test server/test-mcp-server.mjs
      - name: Run Secret Scanner
        run: node templates/multi-agent/Tools/AIControlPlane/scan-secrets.mjs server unity-package rules skills templates
